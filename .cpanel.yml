---
# cPanel Git Version Control — tasks run by the "Deploy HEAD Commit" button.
#
# Deliberately just one line: the actual steps live in /deploy.sh, because the
# same steps also have to be runnable from a cron entry (this account has no
# terminal, and cron is the mechanism that is known to work here). Keeping
# them in the script means the two paths cannot drift apart — a deploy done
# through cron and one done through this button do exactly the same thing.
#
# deploy.sh locates the application from its own path, so nothing here needs
# to know where the account keeps the site.
#
# NOTE: this file only does anything if the repository is actually set up
# under cPanel's Git Version Control. If it is not, ignore it and use the cron
# entry instead — see the "Deploy" section in CLAUDE.md.

# cPanel runs these tasks with the working directory set to the repository
# root, so the relative path is the reliable form here — $0 inside a task is
# the shell, not this file, and dirname on it points somewhere else entirely.
# The absolute fallback covers a cPanel version that does not chdir first.
deployment:
  tasks:
    - /bin/bash deploy.sh || /bin/bash /home/sdvunf/arm.sdvunf.uz/deploy.sh
